name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Python 3.10 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.10'
          enable-cache: true
      - name: Install locked environment
        run: uv sync --locked
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Format
        run: uv run --frozen ruff format --check .
      - name: Test
        run: uv run --frozen python -m pytest -q
      - name: Run public demo
        run: uv run --frozen cashflow-demo --config configs/demo.yaml
      - name: Render method figures
        if: runner.os == 'Linux'
        run: uv run --locked --group figures python scripts/figures/generate.py --config configs/figures/paper.yaml
