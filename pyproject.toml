[project]
name = "cashflow-ml"
version = "0.1.0"
description = "Reproducible cashflow credit-risk modeling with a soft-routing LightGBM mixture of experts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "joblib",
    "lightgbm",
    "numpy",
    "pandas",
    "pyarrow",
    "pyyaml",
    "scikit-learn",
    "scipy",
]

[project.scripts]
cashflow-run = "cashflow_ml.main:main"
cashflow-demo = "cashflow_ml.demo:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["data", "logs", "artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
